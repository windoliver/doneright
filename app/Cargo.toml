[package]
name = "doneright-app"
version = "0.0.1"
edition = "2024"
publish = false
description = "DoneRight app prototype on gpui-kit: one Set up button, then the live flow map."

[dependencies]
gpui-kit = "0.7.1"

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2

[features]
# Headless snapshots for the screenshot page: renders each state with GPUI's Metal
# test renderer, so no display (or unlocked screen) is needed. Not part of the app.
snap = ["gpui-kit/test-support"]
